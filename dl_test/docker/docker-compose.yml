services:
  # 백엔드 API 서비스
  backend:
    build: 
      context: ..
      dockerfile: docker/Dockerfile
    container_name: dog-similarity-backend
    expose:
      - "8001"
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    volumes:
      # 모델 파일 마운트 (최상위 models 폴더)
      - ../../models:/app/models:ro
      - ../../mm_pose:/app/mm_pose:ro
      # 업로드 및 출력 폴더 마운트 (최상위 폴더들)
      - ../../uploads:/app/uploads
      - ../../output_keypoints:/app/output_keypoints
      # 로그 폴더 (옵션)
      - ./logs:/app/logs
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 프론트엔드 웹 서비스
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: dog-similarity-frontend
    ports:
      - "80:80"
    volumes:
      # Static file serving을 위한 볼륨 마운트 (최상위 폴더들)
      - ../../uploads:/var/www/uploads:ro
      - ../../output_keypoints:/var/www/output_keypoints:ro
    depends_on:
      - backend
    restart: unless-stopped

  # Redis 캐시 서비스 (옵션 - 성능 향상용)
  redis:
    image: redis:7-alpine
    container_name: dog-similarity-redis
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes

volumes:
  redis_data:
    driver: local

networks:
  default:
    name: dog-similarity-network
