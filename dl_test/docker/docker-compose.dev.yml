version: '3.8'

services:
  # 개발용 백엔드 서비스
  backend:
    build: 
      context: .
      dockerfile: Dockerfile.dev
    container_name: dog-similarity-dev
    ports:
      - "8001:8001"
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=development
    env_file:
      - .env
    volumes:
      # 코드 실시간 마운트 (핫 리로드)
      - .:/app
      # 모델 파일 마운트
      - ../models:/app/models:ro
      - ../mm_pose:/app/mm_pose:ro
      # 업로드 및 출력 폴더 마운트
      - ../uploads:/app/uploads
      - ../output_keypoints:/app/output_keypoints
    restart: unless-stopped

networks:
  default:
    name: dog-similarity-dev-network
